<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>和平精英 · 传世武器商城</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0b0f1a;
    --bg-soft: #121826;
    --card: #161e2f;
    --card-hover: #1c2740;
    --line: #26324d;
    --gold: #f0b429;
    --gold-soft: #ffd76a;
    --text: #eaf0fa;
    --text-dim: #9aa8c4;
    --danger: #ff6b6b;
    --ok: #3ddc97;
  }

  body {
    font-family: "Microsoft YaHei", "PingFang SC", -apple-system, Segoe UI, sans-serif;
    background: radial-gradient(1200px 600px at 15% -10%, #1b2b4d 0%, var(--bg) 55%) fixed;
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 110px;
  }

  /* ---------- Header ---------- */
  header {
    padding: 20px 16px 16px;
    text-align: center;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(240,180,41,.08), transparent);
  }
  header h1 {
    font-size: 24px;
    letter-spacing: 2px;
    background: linear-gradient(90deg, var(--gold-soft), var(--gold), #ff9a3c);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header p {
    margin-top: 8px;
    color: var(--text-dim);
    font-size: 12.5px;
    letter-spacing: .5px;
  }
  .badges {
    margin-top: 14px;
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .badge {
    font-size: 12px;
    color: var(--gold-soft);
    border: 1px solid rgba(240,180,41,.4);
    background: rgba(240,180,41,.08);
    padding: 4px 12px;
    border-radius: 999px;
  }

  /* ---------- Toolbar ---------- */
  .toolbar {
    max-width: 480px;
    margin: 16px auto 0;
    padding: 0 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .toolbar .hint { color: var(--text-dim); font-size: 13px; }
  .btn-ghost {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text-dim);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    transition: .18s;
  }
  .btn-ghost:hover { color: var(--text); border-color: var(--gold); }

  /* ---------- Grid ---------- */
  main {
    max-width: 480px;
    margin: 12px auto 0;
    padding: 0 14px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: border-color .18s, box-shadow .18s;
  }
  .card:hover {
    transform: translateY(-2px);
    border-color: rgba(240,180,41,.55);
    box-shadow: 0 14px 34px rgba(0,0,0,.45);
  }

  .thumb {
    display: block;
    position: relative;
    background: linear-gradient(135deg, #1e2a47, #101728);
    line-height: 0;
  }
  .thumb::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(240px 120px at 50% 40%, rgba(240,180,41,.16), transparent 70%);
    z-index: 0;
  }
  .thumb img {
    position: relative;
    z-index: 1;
    display: block;
    width: 100%;
    height: auto;
    max-height: 400px;
    object-fit: contain;
  }
  .thumb .ph {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 150px;
    font-size: 44px;
    line-height: 1;
  }
  .rank {
    position: absolute;
    top: 10px;
    left: 12px;
    font-size: 11px;
    letter-spacing: 1px;
    color: #0b0f1a;
    background: linear-gradient(90deg, var(--gold-soft), var(--gold));
    padding: 3px 9px;
    border-radius: 6px;
    font-weight: 700;
    z-index: 2;
  }
  .rarity {
    align-self: flex-start;
    font-size: 10.5px;
    line-height: 1.6;
    color: var(--gold-soft);
    border: 1px solid rgba(240,180,41,.45);
    padding: 1px 7px;
    border-radius: 6px;
    margin-top: 5px;
  }

  .body { padding: 13px 14px 14px; display: flex; flex-direction: column; flex: 1; min-width: 0; }
  .name { font-size: 18px; font-weight: 700; letter-spacing: 1px; }
  .sub { margin-top: 5px; color: var(--text-dim); font-size: 12.5px; }

  .price-row { margin-top: 14px; display: flex; align-items: baseline; gap: 6px; }
  .cur { color: var(--gold); font-size: 14px; }
  .price { color: var(--gold); font-size: 26px; font-weight: 800; letter-spacing: .5px; }
  .unit { color: var(--text-dim); font-size: 12px; margin-left: 2px; }

  .actions { margin-top: 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .btns { display: flex; gap: 8px; margin-left: auto; }

  .stepper {
    display: flex;
    align-items: center;
    border: 1px solid var(--line);
    border-radius: 9px;
    overflow: hidden;
    background: var(--bg-soft);
  }
  .stepper button {
    width: 32px; height: 32px;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    transition: .15s;
  }
  .stepper button:hover:not(:disabled) { background: rgba(240,180,41,.18); color: var(--gold-soft); }
  .stepper button:disabled { color: #4a5674; cursor: not-allowed; }
  .stepper .qty {
    width: 34px;
    text-align: center;
    font-size: 14px;
    font-weight: 700;
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
    height: 32px;
    line-height: 32px;
  }

  .btn-detail, .btn-service {
    border-radius: 9px;
    font-size: 12.5px;
    cursor: pointer;
    white-space: nowrap;
    padding: 8px 11px;
    transition: .18s;
  }
  .btn-detail {
    background: rgba(240,180,41,.1);
    border: 1px solid rgba(240,180,41,.5);
    color: var(--gold-soft);
  }
  .btn-detail:hover { background: var(--gold); color: #0b0f1a; font-weight: 700; }
  .btn-service {
    background: rgba(61,220,151,.1);
    border: 1px solid rgba(61,220,151,.45);
    color: var(--ok);
  }
  .btn-service:hover { background: var(--ok); color: #071b12; font-weight: 700; }

  /* ---------- Bottom bar ---------- */
  .bar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: rgba(13,18,30,.96);
    border-top: 1px solid var(--line);
    backdrop-filter: blur(8px);
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px));
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .bar-inner {
    max-width: 480px; margin: 0 auto; width: 100%;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .bar-left { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .summary { font-size: 12px; color: var(--text-dim); }
  .summary b { color: var(--text); }
  .total { font-size: 13px; color: var(--text-dim); }
  .total strong {
    color: var(--gold);
    font-size: 22px;
    font-weight: 800;
    margin-left: 4px;
  }
  .bar-btns { display: flex; gap: 8px; align-items: center; }
  .btn-service-bar {
    background: rgba(61,220,151,.12);
    border: 1px solid rgba(61,220,151,.5);
    color: var(--ok);
    font-size: 13px;
    font-weight: 700;
    padding: 11px 14px;
    border-radius: 10px;
    cursor: pointer;
    transition: .18s;
    white-space: nowrap;
  }
  .btn-service-bar:hover { background: var(--ok); color: #071b12; }
  .btn-buy {
    background: linear-gradient(90deg, var(--gold-soft), #ff9a3c);
    color: #14100a;
    border: none;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 1px;
    padding: 12px 18px;
    border-radius: 10px;
    cursor: pointer;
    transition: .18s;
    white-space: nowrap;
  }
  .btn-buy:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .btn-buy:disabled { opacity: .45; cursor: not-allowed; transform: none; filter: none; }

  /* ---------- Modal (bottom sheet) ---------- */
  .mask {
    position: fixed; inset: 0;
    background: rgba(4,7,14,.74);
    display: none;
    align-items: flex-end; justify-content: center;
    z-index: 50;
  }
  .mask.open { display: flex; }
  .modal {
    width: 100%; max-width: 480px;
    background: var(--card);
    border: 1px solid rgba(240,180,41,.4);
    border-bottom: none;
    border-radius: 18px 18px 0 0;
    overflow: hidden;
    animation: slideup .22s ease-out;
    max-height: 84vh;
    display: flex;
    flex-direction: column;
  }
  @keyframes slideup { from { transform: translateY(6%); opacity: .4; } to { transform: translateY(0); opacity: 1; } }
  .modal-head {
    padding: 16px 18px;
    background: linear-gradient(135deg, #22314f, #141b2c);
    display: flex; align-items: center; gap: 12px;
    position: relative;
  }
  .modal-head .ico { font-size: 34px; flex-shrink: 0; }
  .modal-head .ico img { width: 52px; height: 52px; object-fit: contain; display: block; }
  .modal-head h3 { font-size: 18px; letter-spacing: 1px; }
  .modal-head .tagline { color: var(--gold-soft); font-size: 12px; margin-top: 4px; }
  .grab { position: absolute; top: 7px; left: 50%; transform: translateX(-50%); width: 42px; height: 4px; border-radius: 999px; background: rgba(255,255,255,.22); }
  .modal-body { padding: 16px 18px; overflow-y: auto; }
  .modal-body p.desc { color: #c7d3e8; font-size: 13.5px; line-height: 1.7; }
  .modal-shot {
    margin: -16px -18px 14px;
    background: #101728;
    line-height: 0;
  }
  .modal-shot img { display: block; width: 100%; height: auto; }
  .modal-shot .ph {
    display: flex; align-items: center; justify-content: center;
    min-height: 170px; font-size: 54px; line-height: 1;
  }
  .specs { margin-top: 14px; border-top: 1px dashed var(--line); padding-top: 10px; }
  .spec {
    display: flex; justify-content: space-between;
    padding: 8px 0; border-bottom: 1px solid rgba(38,50,77,.6);
    font-size: 13px;
  }
  .spec span { color: var(--text-dim); }
  .spec b { font-weight: 600; }
  .modal-foot {
    padding: 12px 18px calc(12px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    flex-wrap: wrap;
  }
  .modal-foot .price-row { margin: 0; }
  .modal-foot .price { font-size: 20px; }
  .close {
    background: transparent; border: 1px solid var(--line); color: var(--text-dim);
    padding: 8px 14px; border-radius: 9px; cursor: pointer; font-size: 12.5px;
  }
  .close:hover { color: var(--text); border-color: var(--gold); }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed; left: 50%; top: 24px; transform: translateX(-50%) translateY(-24px);
    background: #1a2438;
    border: 1px solid var(--gold);
    color: var(--gold-soft);
    padding: 11px 22px;
    border-radius: 10px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: .25s;
    z-index: 99;
    box-shadow: 0 10px 30px rgba(0,0,0,.5);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- Customer service ---------- */
  .cs-chat {
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px;
    height: 210px;
    overflow-y: auto;
    display: flex; flex-direction: column; gap: 8px;
  }
  .msg { max-width: 82%; padding: 8px 11px; border-radius: 11px; font-size: 13px; line-height: 1.55; }
  .msg.cs { background: #1c2740; border: 1px solid var(--line); align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg.me { background: rgba(61,220,151,.16); border: 1px solid rgba(61,220,151,.4); align-self: flex-end; border-bottom-right-radius: 4px; }
  .cs-quick { display: flex; flex-wrap: wrap; gap: 7px; }
  .q-btn {
    background: transparent;
    border: 1px solid rgba(61,220,151,.45);
    color: var(--ok);
    font-size: 12px;
    padding: 5px 10px;
    border-radius: 999px;
    cursor: pointer;
    transition: .15s;
  }
  .q-btn:hover { background: rgba(61,220,151,.14); }
  .cs-input { display: flex; gap: 8px; margin-top: 10px; }
  .cs-input input {
    flex: 1; min-width: 0;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--text);
    font-size: 13px;
    padding: 10px 12px;
    outline: none;
  }
  .cs-input input:focus { border-color: rgba(61,220,151,.6); }
  .cs-input button {
    background: var(--ok);
    color: #071b12;
    border: none;
    font-weight: 700;
    font-size: 13px;
    padding: 10px 16px;
    border-radius: 10px;
    cursor: pointer;
  }
  .cs-input button:disabled { opacity: .5; cursor: not-allowed; }

  /* ---------- Human agent channel ---------- */
  .cs-ch.wide { grid-column: 1 / -1; }
  .cs-ch.wide { border-color: rgba(240,180,41,.5); background: rgba(240,180,41,.07); }
  .cs-tabs { display: flex; gap: 8px; margin-top: 12px; }
  .cs-tab {
    flex: 1;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    color: var(--text-dim);
    font-size: 12.5px;
    font-weight: 700;
    padding: 9px 0;
    border-radius: 9px;
    cursor: pointer;
    transition: .16s;
  }
  .cs-tab.on { color: var(--gold-soft); border-color: rgba(240,180,41,.6); background: rgba(240,180,41,.1); }
  .cs-card {
    margin-top: 12px;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px;
  }
  .cs-card .hd { font-size: 13.5px; font-weight: 700; }
  .cs-card .sub2 { font-size: 11.5px; color: var(--text-dim); margin-top: 4px; line-height: 1.6; }
  .cs-ticketno {
    margin-top: 10px;
    font-family: Consolas, monospace;
    font-size: 13px;
    color: var(--gold-soft);
    background: rgba(240,180,41,.08);
    border: 1px dashed rgba(240,180,41,.45);
    border-radius: 8px;
    padding: 8px 10px;
    word-break: break-all;
  }
  .cs-bar { height: 5px; background: #22304c; border-radius: 999px; overflow: hidden; margin-top: 10px; }
  .cs-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold-soft), #ff9a3c); transition: width .8s linear; }
  .cs-btn {
    margin-top: 10px;
    width: 100%;
    background: linear-gradient(90deg, var(--gold-soft), #ff9a3c);
    color: #14100a;
    border: none;
    font-weight: 800;
    font-size: 13.5px;
    padding: 11px 0;
    border-radius: 10px;
    cursor: pointer;
  }
  .cs-btn.g { background: var(--ok); color: #071b12; }
  .cs-btn.o { background: transparent; border: 1px solid var(--line); color: var(--text-dim); font-weight: 600; }
  .cs-field { margin-top: 10px; }
  .cs-field label { display: block; font-size: 11.5px; color: var(--text-dim); margin-bottom: 5px; }
  .cs-field input, .cs-field textarea {
    width: 100%;
    background: #101828;
    border: 1px solid var(--line);
    border-radius: 9px;
    color: var(--text);
    font-size: 13px;
    padding: 9px 11px;
    outline: none;
    font-family: inherit;
  }
  .cs-field textarea { min-height: 62px; resize: vertical; }
  .cs-field input:focus, .cs-field textarea:focus { border-color: rgba(240,180,41,.6); }
  .cs-list { margin-top: 10px; display: flex; flex-direction: column; gap: 7px; }
  .cs-item {
    background: #101828;
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 8px 10px;
    font-size: 11.5px;
    color: var(--text-dim);
    line-height: 1.6;
  }
  .cs-item b { color: var(--gold-soft); font-family: Consolas, monospace; }
  .msg.agent { background: rgba(240,180,41,.12); border: 1px solid rgba(240,180,41,.4); align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg.sys { align-self: center; text-align: center; background: transparent; border: none; color: #6f7d99; font-size: 11px; max-width: 100%; }
  .cs-warn {
    margin-top: 10px;
    font-size: 11px;
    line-height: 1.6;
    color: #ffb1a1;
    background: rgba(255,107,107,.08);
    border: 1px solid rgba(255,107,107,.3);
    border-radius: 9px;
    padding: 8px 10px;
  }

  footer {
    max-width: 480px; margin: 22px auto 0; padding: 0 14px;
    color: #64718c; font-size: 11px; text-align: center; line-height: 1.8;
  }

  @media (min-width: 760px) {
    main { max-width: 640px; }
    .toolbar, footer { max-width: 640px; }
    .bar-inner { max-width: 640px; }
    .modal { margin: 0 auto; }
  }
</style>
</head>
<body>

<header>
  <h1>和平精英 · 传世武器商城</h1>
  <p>近战传世系列 | 现货秒发 · 支持验号 · 全程担保</p>
  <div class="badges">
    <span class="badge">官方正版皮肤</span>
    <span class="badge">担保交易</span>
    <span class="badge">7×24 发货</span>
    <span class="badge">本页为前端演示页</span>
  </div>
</header>

<div class="toolbar">
  <div class="hint">按上架顺序：火焰刀 → 蝴蝶刀 → 双截棍 → 尾刺。用「− / +」调整数量，「查看详情」看属性，「客服」咨询发货与价格。</div>
  <button class="btn-ghost" id="resetBtn">重置全部数量</button>
</div>

<main id="goods"></main>

<div class="bar">
  <div class="bar-inner">
    <div class="bar-left">
      <div class="summary">已选 <b id="sumCount">0</b> 件 · <b id="sumKinds">0</b> 种武器</div>
      <div class="total">合计<strong id="sumTotal">¥0</strong></div>
    </div>
    <div class="bar-btns">
      <button class="btn-service-bar" id="barServiceBtn">联系客服</button>
      <button class="btn-buy" id="buyBtn" disabled>立即结算</button>
    </div>
  </div>
</div>

<div class="mask" id="mask">
  <div class="modal" id="modal"></div>
</div>

<div class="mask" id="csMask">
  <div class="modal" id="csModal"></div>
</div>

<div class="toast" id="toast"></div>

<footer>
  本页面商品价格与商品信息仅用于前端演示，不构成真实交易要约，也不代表官方定价与销售渠道。<br>
  虚拟物品交易请通过游戏内官方渠道进行，谨防站外私下交易风险。
</footer>

<script>
const GAMES = [
  {
    id: 'huoyandao',

const MAX_QTY = 99;
const cart = {};
GAMES.forEach(g => cart[g.id] = 0);

const goodsBox = document.getElementById('goods');
const sumCount = document.getElementById('sumCount');
const sumKinds = document.getElementById('sumKinds');
const sumTotal = document.getElementById('sumTotal');
const buyBtn   = document.getElementById('buyBtn');
const mask     = document.getElementById('mask');
const modal    = document.getElementById('modal');
const toastEl  = document.getElementById('toast');

function money(n) { return '¥' + n.toLocaleString('zh-CN'); }

function thumbHtml(g) {
  if (g.img) {
    return `<img src="${g.img}" alt="${g.name} 游戏内外观"
              onerror="this.onerror=null;this.parentNode.innerHTML='<div class=ph>${g.icon}</div><span class=&quot;rank&quot;>NO.${GAMES.indexOf(g) + 1}</span>'">`;
  }
  return `<div class="ph">${g.icon}</div>`;
}

function render() {
  goodsBox.innerHTML = GAMES.map(g => `
    <section class="card" data-id="${g.id}">
      <div class="thumb">
        <span class="rank">NO.${GAMES.indexOf(g) + 1}</span>
        ${thumbHtml(g)}
      </div>
      <div class="body">
        <div class="name">${g.name}</div>
        <span class="rarity">${g.rarity}</span>
        <div class="sub">${g.sub}</div>
        <div class="price-row">
          <span class="cur">¥</span>
          <span class="price">${g.price.toLocaleString('zh-CN')}</span>
          <span class="unit">/ 把</span>
        </div>
        <div class="actions">
          <div class="stepper">
            <button class="dec" aria-label="减少数量">−</button>
            <span class="qty">${cart[g.id]}</span>
            <button class="inc" aria-label="增加数量">+</button>
          </div>
          <div class="btns">
            <button class="btn-service">客服</button>
            <button class="btn-detail">查看详情</button>
          </div>
        </div>
        <div class="sub subtotal" style="margin-top:12px">小计 <b style="color:var(--gold)">${money(g.price * cart[g.id])}</b></div>
      </div>
    </section>
  `).join('');
  updateBar();
}

function updateBar() {
  let count = 0, kinds = 0, total = 0;
  GAMES.forEach(g => {
    if (cart[g.id] > 0) { kinds++; count += cart[g.id]; total += cart[g.id] * g.price; }
  });
  sumCount.textContent = count;
  sumKinds.textContent = kinds;
  sumTotal.textContent = money(total);
  buyBtn.disabled = count === 0;

  document.querySelectorAll('.card').forEach(card => {
    const id = card.dataset.id;
    const g = GAMES.find(x => x.id === id);
    card.querySelector('.qty').textContent = cart[id];
    card.querySelector('.dec').disabled = cart[id] === 0;
    card.querySelector('.inc').disabled = cart[id] >= MAX_QTY;
    const subtotal = card.querySelector('.subtotal b');
    if (subtotal) subtotal.textContent = money(g.price * cart[id]);
  });
}

function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toastEl.classList.remove('show'), 1800);
}

goodsBox.addEventListener('click', e => {
  const card = e.target.closest('.card');
  if (!card) return;
  const id = card.dataset.id;
  const g = GAMES.find(x => x.id === id);

  if (e.target.classList.contains('inc')) {
    if (cart[id] < MAX_QTY) { cart[id]++; updateBar(); toast(`已选 ${cart[id]} 把 ${g.name}`); }
    return;
  }
  if (e.target.classList.contains('dec')) {
    if (cart[id] > 0) { cart[id]--; updateBar(); toast(cart[id] ? `已选 ${cart[id]} 把 ${g.name}` : `${g.name} 已移除`); }
    return;
  }
  if (e.target.classList.contains('btn-detail')) {
    openDetail(g);
    return;
  }
  if (e.target.classList.contains('btn-service')) {
    openService(g);
  }
});

function openDetail(g) {
  modal.innerHTML = `
    <div class="modal-head">
      <span class="grab"></span>
      <div class="ico">${g.img ? `<img src="${g.img}" alt="${g.name}">` : g.icon}</div>
      <div>
        <h3>${g.name}</h3>
        <div class="tagline">${g.rarity} · ${g.sub}</div>
      </div>
    </div>
    <div class="modal-body">
      <div class="modal-shot">${g.img ? `<img src="${g.img}" alt="${g.name} 游戏内外观">` : `<div class="ph">${g.icon}</div>`}</div>
      <p class="desc">${g.desc}</p>
      <div class="specs">
        ${g.specs.map(s => `<div class="spec"><span>${s[0]}</span><b>${s[1]}</b></div>`).join('')}
      </div>
    </div>
    <div class="modal-foot">
      <div class="price-row">
        <span class="cur">¥</span><span class="price" style="font-size:20px">${g.price.toLocaleString('zh-CN')}</span>
        <span class="unit">/ 把 · 当前已选 ${cart[g.id]} 把</span>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <div class="stepper">
          <button id="mDec">−</button>
          <span class="qty" id="mQty">${cart[g.id]}</span>
          <button id="mInc">+</button>
        </div>
        <button class="btn-service" id="mService">咨询客服</button>
        <button class="close" id="mClose">关闭</button>
      </div>
    </div>
  `;
  mask.classList.add('open');

  const sync = () => {
    document.getElementById('mQty').textContent = cart[g.id];
    updateBar();
    const foot = modal.querySelector('.unit');
    if (foot) foot.textContent = `/ 把 · 当前已选 ${cart[g.id]} 把`;
  };
  document.getElementById('mInc').onclick = () => { if (cart[g.id] < MAX_QTY) { cart[g.id]++; sync(); } };
  document.getElementById('mDec').onclick = () => { if (cart[g.id] > 0) { cart[g.id]--; sync(); } };
  document.getElementById('mClose').onclick = closeDetail;
  document.getElementById('mService').onclick = () => { closeDetail(); openService(g); };
}

function closeDetail() { mask.classList.remove('open'); }
mask.addEventListener('click', e => { if (e.target === mask) closeDetail(); });

const csMask  = document.getElementById('csMask');
const csModal = document.getElementById('csModal');
let csLog = [];
let csProduct = null;

let csMode = CS_MODES.BOT;
let csTickets = [];
let csQueuePos = 0;
let csQueueTimer = null;
let csSeq = 1000;

const QUICK_QS = ['多久发货？', '是正版皮肤吗？', '价格还能优惠吗？', '支持验号吗？', '现在有多少库存？'];
const HUMAN_QUICKS = ['转人工需要多久？', '人工能帮我查订单吗？', '我想反馈皮肤问题', '能留下联系方式吗？'];

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

function csAnswer(q, g) {
  const t = q.toLowerCase();
  const name = g ? `「${g.name}」` : '该武器';
  if (/发货|多久|时间|什么时候/.test(q)) {
    return `演示页说明：这里没有真实订单，所以无法承诺发货时间。实际交易请以游戏内官方渠道的到账提示为准。`;
  }
  if (/正版|正品|官方|真的/.test(q)) {
    return `${name}的皮肤只能通过《和平精英》游戏内官方渠道获得。本页面只是前端演示，不售卖任何真实皮肤或账号。`;
  }
  if (/价|优惠|便宜|降价|折扣|少点/.test(q)) {
    const priceTxt = g ? `页面标价是 ¥${g.price}/把，` : '';
    return `${priceTxt}这是写死在演示页里的数字，不是可调的真实报价，也没有议价通道。`;
  }
  if (/验号|安全|担保|靠谱|被骗|骗/.test(q)) {
    return `演示页没有担保与验号流程。真实交易中请避免站外私下转账与代充，谨防账号与财产损失。`;
  }
  if (/库存|数量|几把|多少/.test(q)) {
    return `页面不做库存管理，数量按钮只是本地计数（最多 ${MAX_QTY}），刷新后会清零。`;
  }
  if (/退|退款|换/.test(q)) {
    return `本页面是纯前端演示，不产生真实订单，因此不存在退款或换货。相关规则请以官方渠道说明为准。`;
  }
  if (/客服|人工|电话|联系方式|微信|QQ/.test(q)) {
    return `想要人工处理，可以点上方「👤 人工客服」标签：页面里有模拟转接与工单两个入口。注意两者都是前端演示，不存在真实坐席，也不会把你的信息发送到任何地方。`;
  }
  if (/结算|下单|买|付款|支付/.test(q)) {
    return `底部「立即结算」只会弹出所选清单做演示，不会跳转任何支付页面。`;
  }
  return `关于${name}，我在这个演示页里能回答发货、正版、价格、库存、验号这几类问题。需要更权威的答复，请到游戏内官方渠道咨询。`;
}

function pushMsg(who, text) {
  csLog.push({ who, text });
  renderService();
}

function humanReply(q, g) {
  const name = g ? `「${g.name}」` : '该武器';
  if (/多久|排队|等多长|时间/.test(q)) return `演示说明：这里的"人工客服"是我在页面里模拟出来的会话，不存在真实坐席，也没有等待时长。`;
  if (/订单|查|物流|进度/.test(q)) return `演示页说明：本页面不产生真实订单，也没有订单系统，所以我无法查询任何订单信息。真实订单请以游戏内官方渠道的记录为准。`;
  if (/反馈|问题|故障|申诉/.test(q)) return `已收到你的反馈内容。请注意：这条记录只保存在当前页面内存中，刷新即丢失，没有提交给任何客服团队。需要正式反馈请走游戏内官方渠道。`;
  if (/联系|电话|微信|qq|号码|加/.test(q)) return `我不会索取、也不提供联系方式。真实交易中请警惕索要账号、验证码或私下转账的"客服"。`;
  if (/价格|优惠|便宜|少/.test(q)) return `${name}在本页的标价是演示数字，我不能改价，也不存在议价。`;
  return `我仍在演示会话中，可以回答${name}的发货、价格、库存、验号类问题；涉及真实订单与售后的处理，请以游戏内官方渠道为准。`;
}

function ticketNo() {
  csSeq += 1;
  const d = new Date();
  const ymd = d.getFullYear().toString() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
  return 'CS' + ymd + '-' + csSeq;
}

function stopQueue() {
  if (csQueueTimer) { clearInterval(csQueueTimer); csQueueTimer = null; }
}

function startQueue() {
  stopQueue();
  csMode = CS_MODES.QUEUE;
  csQueuePos = 3;
  renderService();
  csQueueTimer = setInterval(() => {
    if (csMode !== CS_MODES.QUEUE) { stopQueue(); return; }
    csQueuePos--;
    if (csQueuePos <= 0) {
      stopQueue();
      csMode = CS_MODES.AGENT;
      csLog.push({ who: 'sys', text: '—— 模拟人工坐席已接入（非真实客服）——' });
      csLog.push({ who: 'agent', text: `你好，我是本页面的模拟坐席。你可以问${csProduct ? `「${csProduct.name}」` : '这几把武器'}的发货、价格、库存、验号等问题。提醒一句：这里不存在真实人工客服，你的提问不会发送到任何服务器。` });
    }
    renderService();
  }, 900);
}

function backToBot() {
  stopQueue();
  csMode = CS_MODES.BOT;
  renderService();
}

function sendMsg(text) {
  const inHuman = csMode !== CS_MODES.BOT;
  const who = inHuman ? 'agent' : 'cs';
  csLog.push({ who: 'me', text });
  renderService();
  setTimeout(() => {
    csLog.push({ who, text: inHuman ? humanReply(text, csProduct) : csAnswer(text, csProduct) });
    renderService();
  }, 420);
}

function humanPanel() {
  if (csMode === CS_MODES.TICKET) {
    return `
      <div class="cs-card">
        <div class="hd">📄 提交工单</div>
        <div class="sub2">填写后会生成一个演示工单号，仅保存在当前页面内存中，<b>不会发送到任何服务器</b>，刷新即丢失。</div>
        <div class="cs-field">
          <label>问题类型</label>
          <input id="tkType" type="text" maxlength="30" placeholder="如：价格咨询 / 外观问题">
        </div>
        <div class="cs-field">
          <label>问题描述</label>
          <textarea id="tkBody" maxlength="200" placeholder="描述你想咨询的内容"></textarea>
        </div>
        <button class="cs-btn" id="tkSubmit">生成工单号</button>
        <button class="cs-btn o" id="tkCancel">返回人工对话</button>
        ${csTickets.length ? `<div class="cs-list">${csTickets.map(t => `<div class="cs-item"><b>${t.no}</b> · ${esc(t.type) || '未填类型'}<br>${esc(t.body) || '（无描述）'}</div>`).join('')}</div>` : ''}
      </div>`;
  }

  if (csMode === CS_MODES.QUEUE) {
    return `
      <div class="cs-card">
        <div class="hd">⏳ 正在为你转接人工</div>
        <div class="sub2">当前模拟排队位次：<b>${csQueuePos}</b>（前端模拟，非真实排队）</div>
        <div class="cs-bar"><i style="width:${((4 - csQueuePos) / 3 * 100).toFixed(0)}%"></i></div>
        <button class="cs-btn o" id="hCancel">取消转接，返回机器人</button>
      </div>`;
  }

  if (csMode === CS_MODES.AGENT) {
    return `
      <div class="cs-card">
        <div class="hd" style="color:var(--gold-soft)">👤 模拟坐席 012 已接入</div>
        <div class="sub2">该"人工客服"是页面内模拟会话，不存在真实坐席；下方对话仅在本机生成，不上传、不外发。</div>
      </div>
      <div class="cs-quick" id="hQuick" style="margin-top:10px">
        ${HUMAN_QUICKS.map(q => `<button class="q-btn">${esc(q)}</button>`).join('')}
      </div>
      <button class="cs-btn o" id="hEnd" style="margin-top:8px">结束人工会话，返回机器人</button>
      <button class="cs-btn g" id="hTicket" style="margin-top:8px">📄 提交工单</button>`;
  }

  return `
    <div class="cs-card">
      <div class="hd">👤 人工客服</div>
      <div class="sub2">本页面没有真实人工坐席。以下两个入口均为前端模拟：转接后由页面生成本地应答；工单只在当前页面生成单号，不会提交到任何系统。</div>
      <button class="cs-btn" id="hJoin">转人工（本地模拟）</button>
      <button class="cs-btn g" id="hTicket">📄 提交工单</button>
    </div>`;
}

function renderService() {
  const head = csProduct ? `客服 · ${csProduct.name}` : '联系客服';
  const inHuman = csMode !== CS_MODES.BOT;
  const isHuman = csMode === CS_MODES.AGENT;
  csModal.innerHTML = `
    <div class="modal-head">
      <span class="grab"></span>
      <div class="ico">${inHuman ? '👤' : '🎧'}</div>
      <div>
        <h3>${head}</h3>
        <div class="tagline" style="color:${inHuman ? 'var(--gold-soft)' : 'var(--ok)'}">
          ${isHuman ? '人工通道 · 模拟坐席已接入（非真实客服）'
            : inHuman ? '人工通道 · 本地模拟，无真实坐席'
            : '在线 · 本地模拟应答，非真实人工客服'}
        </div>
      </div>
    </div>
    <div class="modal-body">
      <div class="cs-tabs">
        <button class="cs-tab ${!inHuman ? 'on' : ''}" data-tab="bot">🤖 小助手</button>
        <button class="cs-tab ${inHuman ? 'on' : ''}" data-tab="human">👤 人工客服</button>
      </div>

      ${humanPanel()}

      ${csMode === CS_MODES.TICKET ? '' : `
      <div class="cs-chat" id="csChat">
        ${csLog.map(m => `<div class="msg ${m.who}">${esc(m.text)}</div>`).join('')}
      </div>
      <div class="cs-quick" id="csQuick">
        ${(inHuman ? HUMAN_QUICKS : QUICK_QS).map(q => `<button class="q-btn">${esc(q)}</button>`).join('')}
      </div>
      <div class="cs-input">
        <input id="csText" type="text" placeholder="${inHuman ? '向模拟坐席提问' : '输入你的问题'}" maxlength="100" autocomplete="off">
        <button id="csSend">发送</button>
      </div>
      <div class="cs-warn">提示：这是演示页，无真实客服、不联网、不外发你的提问内容。</div>
      `}
    </div>
    <div class="modal-foot">
      <div class="price-row">
        <span class="unit">${csProduct ? `当前咨询：${esc(csProduct.name)} · ¥${csProduct.price}/把 · 已选 ${cart[csProduct.id]} 把` : '未选择具体商品，可直接咨询商品'}</span>
      </div>
      <button class="close" id="csClose">关闭</button>
    </div>
  `;

  const chat = document.getElementById('csChat');
  if (chat) chat.scrollTop = chat.scrollHeight;

  const ask = () => {
    const el = document.getElementById('csText');
    if (!el) return;
    const q = el.value.trim();
    if (!q) { el.focus(); return; }
    el.value = '';
    sendMsg(q);
  };

  const input = document.getElementById('csText');
  if (input) {
    document.getElementById('csSend').onclick = ask;
    input.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); ask(); } };
  }

  const quickBox = document.getElementById('csQuick');
  if (quickBox) quickBox.addEventListener('click', e => {
    const b = e.target.closest('.q-btn');
    if (!b) return;
    sendMsg(b.textContent);
  });

  csModal.querySelector('.cs-tabs').addEventListener('click', e => {
    const t = e.target.closest('.cs-tab');
    if (!t) return;
    if (t.dataset.tab === 'bot') { backToBot(); }
    else { csMode = CS_MODES.HUMAN; renderService(); }
  });

  const hJoin = document.getElementById('hJoin'); if (hJoin) hJoin.onclick = startQueue;
  const hCancel = document.getElementById('hCancel'); if (hCancel) hCancel.onclick = backToBot;
  const hEnd = document.getElementById('hEnd'); if (hEnd) hEnd.onclick = backToBot;
  const hTicket = document.getElementById('hTicket'); if (hTicket) hTicket.onclick = () => { csMode = CS_MODES.TICKET; renderService(); };
  const tkCancel = document.getElementById('tkCancel'); if (tkCancel) tkCancel.onclick = () => { csMode = 'human'; renderService(); };
  const tkSubmit = document.getElementById('tkSubmit');
  if (tkSubmit) tkSubmit.onclick = () => {
    const typeEl = document.getElementById('tkType');
    const bodyEl = document.getElementById('tkBody');
    const type = typeEl ? typeEl.value.trim() : '';
    const body = bodyEl ? bodyEl.value.trim() : '';
    if (!type && !body) { toast('请先填写问题类型或描述'); return; }
    const no = ticketNo();
    csTickets.push({ no, type, body, product: csProduct ? csProduct.name : '—' });
    renderService();
    toast(`演示工单 ${no} 已生成（仅保存在当前页面）`);
  };

  document.getElementById('csClose').onclick = closeService;
}

function greet(g) {
  pushMsg('cs', g
    ? `你好，我是传世武器商城的模拟助手。你正在咨询「${g.name}」（${g.rarity}，¥${g.price}/把）。想问发货、正版、价格、库存还是验号？点下面的问题或直接输入。`
    : '你好，我是传世武器商城的模拟助手。可以先告诉我你想了解哪一把武器，或点下面的常见问题。');
}

function openService(g) {
  csProduct = g || null;
  csLog = [];
  stopQueue();
  csMode = CS_MODES.BOT;
  greet(csProduct);
  csMask.classList.add('open');
}

function closeService() {
  stopQueue();
  csMask.classList.remove('open');
}
csMask.addEventListener('click', e => { if (e.target === csMask) closeService(); });
document.getElementById('barServiceBtn').addEventListener('click', () => openService(null));

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeDetail(); closeService(); }
});

buyBtn.addEventListener('click', () => {
  let count = 0, total = 0;
  const lines = GAMES.filter(g => cart[g.id] > 0).map(g => {
    count += cart[g.id]; total += cart[g.id] * g.price;
    return `${g.name} ×${cart[g.id]}`;
  });
  toast(`演示页：${lines.join('、')}，合计 ${money(total)}`);
});

document.getElementById('resetBtn').addEventListener('click', () => {
  GAMES.forEach(g => cart[g.id] = 0);
  updateBar();
  toast('已重置全部数量');
});

render();
</script>
</body>
</html>
