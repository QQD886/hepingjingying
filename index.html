<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>和平精英 · 传世武器商城</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0b0f1a;
    --bg-soft: #121826;
    --card: #161e2f;
    --card-hover: #1c2740;
    --line: #26324d;
    --gold: #f0b429;
    --gold-soft: #ffd76a;
    --text: #eaf0fa;
    --text-dim: #9aa8c4;
    --danger: #ff6b6b;
    --ok: #3ddc97;
  }

  body {
    font-family: "Microsoft YaHei", "PingFang SC", -apple-system, Segoe UI, sans-serif;
    background: radial-gradient(1200px 600px at 15% -10%, #1b2b4d 0%, var(--bg) 55%) fixed;
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 110px;
  }

  /* ---------- Header ---------- */
  header {
    padding: 34px 24px 22px;
    text-align: center;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(240,180,41,.08), transparent);
  }
  header h1 {
    font-size: 30px;
    letter-spacing: 3px;
    background: linear-gradient(90deg, var(--gold-soft), var(--gold), #ff9a3c);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header p {
    margin-top: 10px;
    color: var(--text-dim);
    font-size: 14px;
    letter-spacing: 1px;
  }
  .badges {
    margin-top: 14px;
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .badge {
    font-size: 12px;
    color: var(--gold-soft);
    border: 1px solid rgba(240,180,41,.4);
    background: rgba(240,180,41,.08);
    padding: 4px 12px;
    border-radius: 999px;
  }

  /* ---------- Toolbar ---------- */
  .toolbar {
    max-width: 1180px;
    margin: 24px auto 0;
    padding: 0 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .toolbar .hint { color: var(--text-dim); font-size: 13px; }
  .btn-ghost {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text-dim);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    transition: .18s;
  }
  .btn-ghost:hover { color: var(--text); border-color: var(--gold); }

  /* ---------- Grid ---------- */
  main {
    max-width: 1180px;
    margin: 16px auto 0;
    padding: 0 24px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: transform .18s, border-color .18s, box-shadow .18s;
  }
  .card:hover {
    transform: translateY(-4px);
    border-color: rgba(240,180,41,.55);
    box-shadow: 0 14px 34px rgba(0,0,0,.45);
  }

  .thumb {
    height: 132px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 52px;
    position: relative;
    background: linear-gradient(135deg, #1e2a47, #101728);
  }
  .thumb::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(180px 90px at 50% 40%, rgba(240,180,41,.16), transparent 70%);
  }
  .thumb img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 1;
  }
  .rank {
    position: absolute;
    top: 10px;
    left: 12px;
    font-size: 11px;
    letter-spacing: 1px;
    color: #0b0f1a;
    background: linear-gradient(90deg, var(--gold-soft), var(--gold));
    padding: 3px 9px;
    border-radius: 6px;
    font-weight: 700;
    z-index: 2;
  }
  .rarity {
    position: absolute;
    top: 10px;
    right: 12px;
    font-size: 11px;
    color: var(--gold-soft);
    border: 1px solid rgba(240,180,41,.45);
    padding: 2px 8px;
    border-radius: 6px;
    z-index: 2;
  }

  .body { padding: 16px 16px 18px; display: flex; flex-direction: column; flex: 1; }
  .name { font-size: 18px; font-weight: 700; letter-spacing: 1px; }
  .sub { margin-top: 5px; color: var(--text-dim); font-size: 12.5px; }

  .price-row { margin-top: 14px; display: flex; align-items: baseline; gap: 6px; }
  .cur { color: var(--gold); font-size: 14px; }
  .price { color: var(--gold); font-size: 26px; font-weight: 800; letter-spacing: .5px; }
  .unit { color: var(--text-dim); font-size: 12px; margin-left: 2px; }

  .actions { margin-top: 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }

  .stepper {
    display: flex;
    align-items: center;
    border: 1px solid var(--line);
    border-radius: 9px;
    overflow: hidden;
    background: var(--bg-soft);
  }
  .stepper button {
    width: 34px; height: 34px;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 19px;
    line-height: 1;
    cursor: pointer;
    transition: .15s;
  }
  .stepper button:hover:not(:disabled) { background: rgba(240,180,41,.18); color: var(--gold-soft); }
  .stepper button:disabled { color: #4a5674; cursor: not-allowed; }
  .stepper .qty {
    width: 44px;
    text-align: center;
    font-size: 15px;
    font-weight: 700;
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
    height: 34px;
    line-height: 34px;
  }

  .btn-detail {
    background: rgba(240,180,41,.1);
    border: 1px solid rgba(240,180,41,.5);
    color: var(--gold-soft);
    padding: 9px 14px;
    border-radius: 9px;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    transition: .18s;
  }
  .btn-detail:hover { background: var(--gold); color: #0b0f1a; font-weight: 700; }

  /* ---------- Bottom bar ---------- */
  .bar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: rgba(13,18,30,.94);
    border-top: 1px solid var(--line);
    backdrop-filter: blur(8px);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .bar-inner {
    max-width: 1180px; margin: 0 auto; width: 100%;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    flex-wrap: wrap;
  }
  .summary { font-size: 13px; color: var(--text-dim); }
  .summary b { color: var(--text); }
  .total { font-size: 14px; color: var(--text-dim); }
  .total strong {
    color: var(--gold);
    font-size: 27px;
    font-weight: 800;
    margin-left: 6px;
  }
  .btn-buy {
    background: linear-gradient(90deg, var(--gold-soft), #ff9a3c);
    color: #14100a;
    border: none;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 1px;
    padding: 12px 30px;
    border-radius: 10px;
    cursor: pointer;
    transition: .18s;
  }
  .btn-buy:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .btn-buy:disabled { opacity: .45; cursor: not-allowed; transform: none; filter: none; }

  /* ---------- Modal ---------- */
  .mask {
    position: fixed; inset: 0;
    background: rgba(4,7,14,.74);
    display: none;
    align-items: center; justify-content: center;
    padding: 20px;
    z-index: 50;
  }
  .mask.open { display: flex; }
  .modal {
    width: 100%; max-width: 560px;
    background: var(--card);
    border: 1px solid rgba(240,180,41,.4);
    border-radius: 16px;
    overflow: hidden;
    animation: pop .2s ease-out;
    max-height: 88vh;
    display: flex;
    flex-direction: column;
  }
  @keyframes pop { from { transform: scale(.94); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal-head {
    padding: 20px 22px;
    background: linear-gradient(135deg, #22314f, #141b2c);
    display: flex; align-items: center; gap: 14px;
  }
  .modal-head .ico { font-size: 38px; }
  .modal-head .ico img { width: 58px; height: 58px; object-fit: cover; border-radius: 10px; display: block; }
  .modal-head h3 { font-size: 21px; letter-spacing: 1px; }
  .modal-head .tagline { color: var(--gold-soft); font-size: 12.5px; margin-top: 4px; }
  .modal-body { padding: 20px 22px; overflow-y: auto; }
  .modal-body p.desc { color: #c7d3e8; font-size: 14px; line-height: 1.75; }
  .specs { margin-top: 16px; border-top: 1px dashed var(--line); padding-top: 14px; }
  .spec {
    display: flex; justify-content: space-between;
    padding: 9px 0; border-bottom: 1px solid rgba(38,50,77,.6);
    font-size: 13.5px;
  }
  .spec span { color: var(--text-dim); }
  .spec b { font-weight: 600; }
  .modal-foot {
    padding: 16px 22px;
    border-top: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    flex-wrap: wrap;
  }
  .modal-foot .price-row { margin: 0; }
  .close {
    background: transparent; border: 1px solid var(--line); color: var(--text-dim);
    padding: 9px 18px; border-radius: 9px; cursor: pointer; font-size: 13px;
  }
  .close:hover { color: var(--text); border-color: var(--gold); }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed; left: 50%; top: 24px; transform: translateX(-50%) translateY(-24px);
    background: #1a2438;
    border: 1px solid var(--gold);
    color: var(--gold-soft);
    padding: 11px 22px;
    border-radius: 10px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: .25s;
    z-index: 99;
    box-shadow: 0 10px 30px rgba(0,0,0,.5);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  footer {
    max-width: 1180px; margin: 30px auto 0; padding: 0 24px;
    color: #64718c; font-size: 12px; text-align: center; line-height: 1.8;
  }

  @media (max-width: 560px) {
    header h1 { font-size: 23px; }
    .bar { padding: 10px 14px; }
    .btn-buy { padding: 11px 20px; }
  }
</style>
</head>

<header>
  <h1>和平精英 · 传世武器商城</h1>
  <p>近战传世系列 | 现货秒发 · 支持验号 · 全程担保</p>
  <div class="badges">
    <span class="badge">官方正版皮肤</span>

      ['可获取形态', '永久'],
      ['参考单价', '¥1288 / 把']
    ]
  }
];

const MAX_QTY = 99;
const cart = {};
GAMES.forEach(g => cart[g.id] = 0);

const goodsBox = document.getElementById('goods');
const sumCount = document.getElementById('sumCount');
const sumKinds = document.getElementById('sumKinds');
const sumTotal = document.getElementById('sumTotal');
const buyBtn   = document.getElementById('buyBtn');
const mask     = document.getElementById('mask');
const modal    = document.getElementById('modal');
const toastEl  = document.getElementById('toast');

function money(n) { return '¥' + n.toLocaleString('zh-CN'); }

function thumbHtml(g) {
  if (g.img) {
    return `<img src="${g.img}" alt="${g.name} 游戏内外观" loading="lazy"
              onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'${g.icon}'}))">`;
  }
  return `<span>${g.icon}</span>`;
}

function render() {
  goodsBox.innerHTML = GAMES.map(g => `
    <section class="card" data-id="${g.id}">
      <div class="thumb">
        <span class="rank">NO.${GAMES.indexOf(g) + 1}</span>
        <span class="rarity">${g.rarity}</span>
        ${thumbHtml(g)}
      </div>
      <div class="body">
        <div class="name">${g.name}</div>
        <div class="sub">${g.sub}</div>
        <div class="price-row">
          <span class="cur">¥</span>
          <span class="price">${g.price.toLocaleString('zh-CN')}</span>
          <span class="unit">/ 把</span>
        </div>
        <div class="actions">
          <div class="stepper">
            <button class="dec" aria-label="减少数量">−</button>
            <span class="qty">${cart[g.id]}</span>
            <button class="inc" aria-label="增加数量">+</button>
          </div>
          <button class="btn-detail">查看详情</button>
        </div>
        <div class="sub" style="margin-top:12px">小计 <b style="color:var(--gold)">${money(g.price * cart[g.id])}</b></div>
      </div>
    </section>
  `).join('');
  updateBar();
}

function updateBar() {
  let count = 0, kinds = 0, total = 0;
  GAMES.forEach(g => {
    if (cart[g.id] > 0) { kinds++; count += cart[g.id]; total += cart[g.id] * g.price; }
  });
  sumCount.textContent = count;
  sumKinds.textContent = kinds;
  sumTotal.textContent = money(total);
  buyBtn.disabled = count === 0;

  document.querySelectorAll('.card').forEach(card => {
    const id = card.dataset.id;
    const g = GAMES.find(x => x.id === id);
    card.querySelector('.qty').textContent = cart[id];
    card.querySelector('.dec').disabled = cart[id] === 0;
    card.querySelector('.inc').disabled = cart[id] >= MAX_QTY;
    const subtotal = card.querySelector('.body > .sub:last-child b');
    if (subtotal) subtotal.textContent = money(g.price * cart[id]);
  });
}

function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toastEl.classList.remove('show'), 1800);
}

goodsBox.addEventListener('click', e => {
  const card = e.target.closest('.card');
  if (!card) return;
  const id = card.dataset.id;
  const g = GAMES.find(x => x.id === id);

  if (e.target.classList.contains('inc')) {
    if (cart[id] < MAX_QTY) { cart[id]++; updateBar(); toast(`已选 ${cart[id]} 把 ${g.name}`); }
    return;
  }
  if (e.target.classList.contains('dec')) {
    if (cart[id] > 0) { cart[id]--; updateBar(); toast(cart[id] ? `已选 ${cart[id]} 把 ${g.name}` : `${g.name} 已移除`); }
    return;
  }
  if (e.target.classList.contains('btn-detail')) {
    openDetail(g);
  }
});

function openDetail(g) {
  modal.innerHTML = `
    <div class="modal-head">
      <div class="ico">${g.img ? `<img src="${g.img}" alt="${g.name}">` : g.icon}</div>
      <div>
        <h3>${g.name}</h3>
        <div class="tagline">${g.rarity} · ${g.sub}</div>
      </div>
    </div>
    <div class="modal-body">
      <p class="desc">${g.desc}</p>
      <div class="specs">
        ${g.specs.map(s => `<div class="spec"><span>${s[0]}</span><b>${s[1]}</b></div>`).join('')}
      </div>
    </div>
    <div class="modal-foot">
      <div class="price-row">
        <span class="cur">¥</span><span class="price" style="font-size:22px">${g.price.toLocaleString('zh-CN')}</span>
        <span class="unit">/ 把 · 当前已选 ${cart[g.id]} 把</span>
      </div>
      <div style="display:flex;gap:10px">
        <div class="stepper">
          <button id="mDec">−</button>
          <span class="qty" id="mQty">${cart[g.id]}</span>
          <button id="mInc">+</button>
        </div>
        <button class="close" id="mClose">关闭</button>
      </div>
    </div>
  `;
  mask.classList.add('open');

  const sync = () => {
    document.getElementById('mQty').textContent = cart[g.id];
    updateBar();
    const foot = modal.querySelector('.unit');
    if (foot) foot.textContent = `/ 把 · 当前已选 ${cart[g.id]} 把`;
  };
  document.getElementById('mInc').onclick = () => { if (cart[g.id] < MAX_QTY) { cart[g.id]++; sync(); } };
  document.getElementById('mDec').onclick = () => { if (cart[g.id] > 0) { cart[g.id]--; sync(); } };
  document.getElementById('mClose').onclick = closeDetail;
}

function closeDetail() { mask.classList.remove('open'); }
mask.addEventListener('click', e => { if (e.target === mask) closeDetail(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });

buyBtn.addEventListener('click', () => {
  let count = 0, total = 0;
  const lines = GAMES.filter(g => cart[g.id] > 0).map(g => {
    count += cart[g.id]; total += cart[g.id] * g.price;
    return `${g.name} ×${cart[g.id]}`;
  });
  toast(`演示页：${lines.join('、')}，合计 ${money(total)}`);
});

document.getElementById('resetBtn').addEventListener('click', () => {
  GAMES.forEach(g => cart[g.id] = 0);
  updateBar();
  toast('已重置全部数量');
});

render();
</script>
</body>
</html>
